<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telefon Kayıt Sistemi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; padding: 50px 12px; margin: 0; }
        .container { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 380px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border: 1px solid #888; border-radius: 4px; font: inherit; }
        input:focus-visible, button:focus-visible { outline: 3px solid #80baff; outline-offset: 2px; }
        .hint { font-size: 13px; line-height: 1.4; color: #555; }
        button { width: 100%; padding: 10px; margin-top: 18px; background-color: #005fc2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #004a96; }
        button:disabled { opacity: 0.65; cursor: progress; }
        #result { margin-top: 15px; padding: 10px; text-align: center; font-weight: bold; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .pending { background-color: #e6f1ff; color: #123b6a; }
    </style>
</head>
<body>
<main class="container">
    <h2>Kayıt Formu</h2>
    <form id="registration-form">
        <label for="name">Ad Soyad</label>
        <input type="text" id="name" name="name" autocomplete="name" required>

        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <label for="phone">Telefon numarası</label>
        <input type="text" id="phone" name="phone" inputmode="numeric"
               pattern="[0-9]{6}" minlength="6" maxlength="6"
               aria-describedby="phone-hint" required>
        <p id="phone-hint" class="hint">Yalnızca 6 rakam. Sistem ek doğrulama kuralları da uygular.</p>

        <button id="submit-button" type="submit">Kaydet</button>
    </form>
    <div id="result" role="status" aria-live="polite" aria-atomic="true"></div>
</main>
<script>
    document.getElementById('registration-form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const data = {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim()
        };
        const resultDiv = document.getElementById('result');
        const submitButton = document.getElementById('submit-button');
        submitButton.disabled = true;
        resultDiv.style.display = 'block';
        resultDiv.className = 'pending';
        resultDiv.textContent = 'İşleniyor...';

        try {
            // Resolve against the site hostname rather than the visitor's own localhost.
            const endpoint = new URL('/api/registration', window.location.origin);
            endpoint.port = '8080';
            const response = await fetch(endpoint.toString(), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            // Older server versions returned plain text for duplicate entries.
            const responseText = await response.text();
            let responseData;
            try {
                responseData = responseText ? JSON.parse(responseText) : {};
            } catch {
                responseData = { message: responseText };
            }

            if (response.ok && responseData.status === 'accepted') {
                resultDiv.className = 'success';
                resultDiv.textContent = responseData.message || 'Kayıt başarılı!';
            } else {
                resultDiv.className = 'error';
                resultDiv.textContent = responseData.message || 'Kayıt yapılamadı. Lütfen tekrar deneyin.';
            }
        } catch (error) {
            console.error('Kayıt isteği başarısız:', error);
            resultDiv.className = 'error';
            resultDiv.textContent = 'Sunucuyla bağlantı kurulamadı!';
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
