<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telefon Kayıt Sistemi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 15px; padding: 10px; text-align: center; font-weight: bold; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kayıt Formu</h2>
    <input type="text" id="name" placeholder="Ad Soyad" required>
    <input type="email" id="email" placeholder="E-posta" required>
    <input type="text" id="phone" placeholder="Telefon (6 Rakam)" maxlength="6" required>

    <button onclick="kayitOl()">Gönder</button>

    <div id="result"></div>
</div>

<script>
    async function kayitOl() {
        const data = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value
        };

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.className = '';
        resultDiv.innerText = 'İşleniyor...';

        try {
            const response = await fetch('http://localhost:8080/api/registration', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const resJson = await response.json();
            if (resJson.status === 'accepted') {
                resultDiv.className = 'success';
                resultDiv.innerText = resJson.message;
            } else {
                resultDiv.className = 'error';
                resultDiv.innerText = resJson.message || "Geçersiz numara, lütfen yeni bir numara deneyin.";
            }
        } catch (error) {
            console.error('Hata:', error);
            resultDiv.className = 'error';
            resultDiv.innerText = "Sunucuyla bağlantı kurulamadı!";
        }
    }
</script>

</body>
</html>
